name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Must match build.zig.zon minimum_zig_version. Update all three
  # together when bumping Zig.
  ZIG_VERSION: "0.17.0-dev.1606+a06534d73"
  ZIG_SHA256: "25bcb0cf8e31314b798f2b9318e1ccd13ea8bd21f030c734923f263578b8d520"

jobs:
  test:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-zig-pinned
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}

      - name: Run test suite (unit, fragments, fuzz, generated-codec e2e)
        run: zig build test

  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-linux
            binary: cddl2c
            artifact: cddl2c-linux-amd64
          - name: windows-amd64
            target: x86_64-windows
            binary: cddl2c.exe
            artifact: cddl2c-windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-zig-pinned
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}

      # Zig cross-compiles the Windows binary from the Linux runner;
      # both outputs are fully static/self-contained.
      - name: Build cddl2c (ReleaseSafe)
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
          mkdir -p dist
          cp zig-out/bin/${{ matrix.binary }} dist/

      - name: Smoke-test generated header (linux build only)
        if: matrix.target == 'x86_64-linux'
        run: |
          ./dist/${{ matrix.binary }} examples/sample.cddl -o /tmp/sample_types.h
          test -s /tmp/sample_types.h
          head -n 3 /tmp/sample_types.h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    # Attach the binaries to GitHub releases on version tags.
    name: release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cddl2c-*
          merge-multiple: true
          path: release

      - name: Package
        run: |
          cd release
          chmod +x cddl2c cddl2c.exe
          sha256sum cddl2c cddl2c.exe > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cddl2c
            release/cddl2c.exe
            release/SHA256SUMS
