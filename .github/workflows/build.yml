name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Must match build.zig.zon minimum_zig_version. Update all three
  # together when bumping Zig.
  ZIG_VERSION: "0.17.0-dev.1606+a06534d73"
  ZIG_SHA256: "25bcb0cf8e31314b798f2b9318e1ccd13ea8bd21f030c734923f263578b8d520"

jobs:
  test:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-zig-pinned
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}

      - name: Run test suite (unit, fragments, fuzz, generated-codec e2e)
        run: zig build test

  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-linux
            binary: cddl2c
            artifact: cddl2c-linux-amd64
          - name: windows-amd64
            target: x86_64-windows
            binary: cddl2c.exe
            artifact: cddl2c-windows-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-zig-pinned
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}

      # Zig cross-compiles the Windows binary from the Linux runner;
      # both outputs are fully static/self-contained.
      - name: Build cddl2c (ReleaseSafe)
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
          mkdir -p dist
          cp zig-out/bin/${{ matrix.binary }} dist/

      - name: Smoke-test generated header (linux build only)
        if: matrix.target == 'x86_64-linux'
        run: |
          ./dist/${{ matrix.binary }} examples/sample.cddl -o /tmp/sample_types.h
          test -s /tmp/sample_types.h
          head -n 3 /tmp/sample_types.h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    # Tag a version (e.g. git tag v1.0.0 && git push origin v1.0.0) and the
    # full test+build pipeline runs; on success the binaries are attached to
    # a GitHub release named after the tag.
    name: release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Downloads each artifact into artifacts/<artifact-name>/ (no merge,
      # so the linux and windows binaries stay distinguishable).
      - uses: actions/download-artifact@v4
        with:
          pattern: cddl2c-*
          path: artifacts

      - name: Package release assets
        run: |
          mkdir -p release
          cp artifacts/cddl2c-linux-amd64/cddl2c release/cddl2c-linux-amd64
          cp artifacts/cddl2c-windows-amd64/cddl2c.exe release/cddl2c-windows-amd64.exe
          chmod +x release/cddl2c-linux-amd64 release/cddl2c-windows-amd64.exe
          cd release && sha256sum cddl2c-linux-amd64 cddl2c-windows-amd64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cddl2c-linux-amd64
            release/cddl2c-windows-amd64.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
